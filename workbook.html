<title>토익 650+ 워크북</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2433;--mute:#6b7385;--line:#dde1e8;--acc:#2f5bb7;--acc2:#e8eefb;--ok:#1e8a4c;--okb:#e5f5ec;--ng:#c2392b;--ngb:#fbe9e7;--sh:0 1px 3px rgba(20,30,50,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121418;--card:#1b1e24;--ink:#e6e8ee;--mute:#9aa1b0;--line:#2c313a;--acc:#7da2f0;--acc2:#1f2a40;--ok:#4cc27f;--okb:#183325;--ng:#ef7d70;--ngb:#3a1d1a;--sh:none}}
:root[data-theme="dark"]{--bg:#121418;--card:#1b1e24;--ink:#e6e8ee;--mute:#9aa1b0;--line:#2c313a;--acc:#7da2f0;--acc2:#1f2a40;--ok:#4cc27f;--okb:#183325;--ng:#ef7d70;--ngb:#3a1d1a;--sh:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:12px 16px 80px}
h1{font-size:22px;margin:8px 0 2px}
.sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.part{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 0;margin:0 0 12px;box-shadow:var(--sh)}
.part h2{font-size:15px;margin:6px 14px 4px;color:var(--acc)}
.deck{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 14px;color:var(--ink);font:inherit;cursor:pointer}
.deck:first-of-type{border-top:0}
.deck .t{flex:1}
.deck .m{color:var(--mute);font-size:12px;white-space:nowrap}
.deck .bar{width:54px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.deck .bar i{display:block;height:100%;background:var(--ok)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top .t{flex:1;font-weight:700;font-size:15px;min-width:150px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.score{font-size:13px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:14px 0;overflow:hidden;box-shadow:var(--sh)}
.sl{position:relative;width:100%;background:#fff}
.sl img{display:block;width:100%;height:auto}
.sl .ov{position:absolute;display:none}
.card.show .sl .ov{display:block}
.meta{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12px;color:var(--mute);border-top:1px solid var(--line);flex-wrap:wrap}
.meta .sp{flex:1}
audio{width:100%;display:block;margin:0;padding:6px 12px 0}
.qrow{padding:8px 12px;border-top:1px dashed var(--line)}
.qrow .lab{font-size:13px;font-weight:700;margin-right:6px}
.ch{display:inline-block;min-width:46px;margin:3px 4px 3px 0;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.ch.sel{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:700}
.ch.ok{background:var(--okb);border-color:var(--ok);color:var(--ok);font-weight:700}
.ch.ng{background:var(--ngb);border-color:var(--ng);color:var(--ng)}
.ex{white-space:pre-line;font-size:13.5px;margin:8px 0 2px;padding:9px 11px;border-left:3px solid var(--acc);background:var(--acc2);border-radius:0 8px 8px 0;display:none}
.card.show .ex,.qrow.done .ex{display:block}
.res{font-size:13px;font-weight:700;margin-left:4px}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:18px}
.hidden{display:none}
</style>

 recently(최근에), conduct a tour(견학을 진행하다), production facility(생산 시설)\n팁  한 절 한 동사. to부정사/-ing 단독은 본동사 불가. recently는 과거 시제와도 결합 가능."]]},{"n":6,"ov":[7.422,5.687,17.578,5.132],"p":137,"q":[[3,2,1,"정답 (B) Receipt\n해석  배송품의 수령은 10일 이내에 예상되어야 한다.\n해설  문장의 주어 자리이므로 명사. (A) Receive는 동사, (B) Receipt(수령)는 명사. (B) Receipt가 정답.\n구조  주어 Receipt of the shipment + 본동사 should be expected + 시간 부사구 within ten days.\n어휘  receipt(수령), shipment(배송품), within ten days(10일 이내에)\n팁  Receive(동사) vs Receipt(명사) 구분. 문장 첫 단어가 명사인지 동사인지 확인."],[4,2,0,"정답 (A) complete\n해석  동봉된 설문지를 작성해서 저희 사무실로 반송해 주십시오.\n해설  Please로 시작하는 명령문 = 동사원형. (A) complete가 정답.\n구조  명령문 Please complete the enclosed survey + 등위절 and return it to our office.\n어휘  complete(작성하다), enclosed survey(동봉된 설문지), return(반송하다)\n팁  Please + 동사원형 = 명령문. -ed/-ing 형태는 본동사 자리 단독 불가."]]},{"n":7,"ov":[7.422,5.687,17.812,5.132],"p":137,"q":[[5,4,3,"정답 (D) negotiator\n해석  계약 협상 중에 Imura 씨는 자신이 뛰어난 협상가임을 증명했다.\n해설  관사 'an' + 형용사 'excellent' 뒤는 명사 자리. 사람 명사 (D) negotiator가 정답.\n구조  전치사구 During the contract talks + 주어 Ms. Imura + 본동사 proved + that절 [that she is an excellent negotiator].\n어휘  contract talks(계약 협상), prove(증명하다), negotiator(협상가)\n팁  an excellent + 사람 명사(-er/-or/-ator) 단골. negotiate(동사) vs negotiator(사람 명사)."]]},{"n":8,"ov":[7.422,5.687,17.812,5.132],"p":137,"q":[[6,4,1,"정답 (B) installation\n해석  사무용 가구가 옮겨지면 바로 카펫 설치가 완료될 수 있다.\n해설  관사 'The' + ___ + of 형태 = 명사 자리. 동사 'can be completed'(단수)와 일치하는 단수 명사 (B) installation이 정답. (C) installers는 사람 복수 명사.\n구조  주어 The installation of the carpet + 본동사 can be completed + 부사절 as soon as the office furniture is moved.\n어휘  installation(설치), carpet(카펫), office furniture(사무용 가구)\n팁  The + 명사 + of + 명사 = ~의 ~. 단수 동사와 짝궁."]]},{"n":9,"ov":[7.422,5.687,17.812,5.132],"p":137,"q":[[7,4,3,"정답 (D) differ\n해석  온라인 쇼핑객들은 제품이 웹사이트에 표시된 이미지와 외관상 다를 수 있다는 점을 유의해야 한다.\n해설  조동사 'may' 뒤는 동사원형. 자동사 'differ from(~과 다르다)'. (D) differ가 정답.\n구조  주어 Online shoppers + 조동사 should + 본동사 note + that절 [that products may differ in appearance from the images shown on a Web site].\n어휘  online shoppers(온라인 쇼핑객), differ from(~과 다르다), appearance(외관)\n팁  조동사 + 동사원형. differ는 자동사로 'differ from + 명사'."]]},{"n":10,"ov":[7.422,5.687,17.812,5.132],"p":137,"q":[[8,4,3,"정답 (D) meeting\n해석  Caine 씨는 이사회 회의의 일정이 변경될 것을 요청했다.\n해설  'the board ___'에서 명사 자리. 'board meeting(이사회 회의)' 복합명사. (D) meeting이 정답.\n구조  주어 Mr. Caine + 본동사 requested + that절 [that the board meeting be rescheduled(가정법)].\n어휘  board meeting(이사회 회의), reschedule(일정을 변경하다)\n팁  복합명사 board + meeting. request that + 주어 + (should) + 동사원형 가정법."]]},{"n":11,"ov":[9.453,11.928,86.562,40.083],"p":138},{"n":12,"ov":[3.438,11.373,85.625,72.954],"p":138},{"n":13,"ov":[3.438,16.782,78.75,50.069],"p":138},{"n":14,"ov":[6.562,15.673,71.875,66.713],"p":138},{"n":15,"ov":[7.422,5.687,17.578,5.132],"p":139,"q":[[1,2,1,"정답 (B) donations\n해석  시 도서관은 6월 30일까지 중고 도서 기증을 받을 것이다.\n해설  타동사 'accept'의 목적어 자리 = 명사. (B) donations가 정답. (A) donates는 동사.\n구조  주어 The city's library + 본동사 will accept + 목적어 donations of used books + 시간 부사구 until June 30.\n어휘  accept donations(기증을 받다), used books(중고 도서)\n팁  동사 + 명사 목적어. donations of/from 단골."],[2,2,1,"정답 (B) creations\n해석  지역 예술가들은 매주 토요일 아침에 자신의 수제 작품을 판매한다.\n해설  타동사 'sell'의 목적어 자리 + 소유격 'their' + 형용사 'handmade' 뒤 = 명사. (B) creations가 정답.\n구조  주어 Local artists + 본동사 sell + 목적어 their handmade creations + 시간 부사구 every Saturday morning.\n어휘  local artist(지역 예술가), handmade(수제의), creation(창작품, 작품)\n팁  소유격 + 형용사 + 명사 = 명사 자리. creative(형용사) vs creations(명사 복수)."]]},{"n":16,"ov":[7.422,5.687,17.578,5.132],"p":139,"q":[[3,2,1,"정답 (B) to postpone\n해석  Martin 씨는 일정 충돌 때문에 기획 회의를 연기하기로 결정했다.\n해설  동사 decide는 to부정사를 목적어로 취함. (B) to postpone이 정답.\n구조  주어 Mr. Martin + 본동사 has decided + to부정사 목적어 to postpone the planning meeting + 원인 부사구 because of a scheduling conflict.\n어휘  decide to(~하기로 결정하다), postpone(연기하다), planning meeting(기획 회의), scheduling conflict(일정 충돌)\n팁  decide/plan/agree/hope/expect + to부정사 단골. to + V 형태로 목적어."],[4,2,1,"정답 (B) slightly\n해석  며칠 동안 높게 유지된 후, 어제 기온이 마침내 약간 떨어졌다.\n해설  자동사 'fell' 뒤 부사 자리. (B) slightly가 정답. (A) slight는 형용사.\n구조  분사구문 After remaining high for several days + 주어 temperatures + 부사 finally + 본동사 fell + 부사 slightly + 시간 부사 yesterday.\n어휘  remain high(높게 유지되다), fall slightly(약간 떨어지다)\n팁  자동사 + 부사. fall/rise/increase/decrease + 부사 (slightly/sharply/gradually)."]]},{"n":17,"ov":[7.422,5.687,17.812,5.132],"p":139,"q":[[5,4,2,"정답 (C) statement\n해석  CEO Donald Farajo는 국제 금융 언론에 합병 제안에 관한 짧은 성명을 발표했다.\n해설  타동사 'issued'의 목적어 + 관사 'a' + 형용사 'brief' 뒤 = 명사. 'issue a statement(성명을 발표하다)'. (C) statement가 정답.\n구조  주어 CEO Donald Farajo + 본동사 issued + 목적어 a brief statement + 수식 on the merger proposal + 부사구 to the international financial press.\n어휘  issue a statement(성명을 발표하다), brief(짧은), merger proposal(합병 제안), financial press(금융 언론)\n팁  issue + 명사(statement/announcement/notice/report) = 발표하다."]]},{"n":18,"ov":[7.422,5.687,17.812,5.132],"p":139,"q":[[6,4,0,"정답 (A) acceptance\n해석  전기차는 배터리 수명이 개선되면 더 넓은 수용을 얻을 것으로 예상된다.\n해설  타동사 'gain'의 목적어 + 형용사 'wider' 뒤 = 명사. (A) acceptance(수용)가 정답.\n구조  주어 Electric vehicles + 본동사 are expected to + 동사원형 gain + 목적어 wider acceptance + 부사절 once their battery life is improved.\n어휘  electric vehicle(전기차), gain wider acceptance(더 넓은 수용을 얻다), battery life(배터리 수명)\n팁  형용사 + 명사. 'gain/lose acceptance' 단골 표현."]]},{"n":19,"ov":[7.422,5.687,17.812,5.132],"p":139,"q":[[7,4,3,"정답 (D) authorization\n해석  사무용품을 주문하기 전에 상사로부터 서면 승인을 받는 것을 기억하라.\n해설  타동사 'obtain'의 목적어 + 형용사 'written' 뒤 = 명사. (D) authorization이 정답.\n구조  명령문 Remember to + 동사원형 obtain + 목적어 written authorization + 부사구 from a supervisor + 부사절 before placing an order for office supplies.\n어휘  obtain authorization(승인을 받다), written authorization(서면 승인), supervisor(상사)\n팁  obtain/get/require + 명사 단골. 'written + 명사'는 '서면 ~'."]]},{"n":20,"ov":[7.422,5.687,17.812,5.132],"p":139,"q":[[8,4,1,"정답 (B) them\n해석  Oliver 씨는 직물이 어떻게 생겼는지 보여주기 위해 고객들에게 몇 개의 샘플을 주었다.\n해설  동사 'show'의 간접 목적어 자리 = 목적격. 앞 'customers'를 받는 ers and Tailors + 본동사 is known for + 목적어 its expert alterations of formal wear.\n어휘  be known for(~으로 유명하다), expert alteration(전문적 수선), formal wear(정장)\n팁  소유격 + 형용사 + 명사. 'is known for + 명사' 단골."]]},{"n":40,"ov":[7.5,5.687,9.375,5.132],"p":142,"q":[[10,4,2,"정답 (C) encouragement\n해석  때때로 직원들은 위험을 감수하고 새로운 문제 해결 방식을 시도하기 위해 격려가 필요하다.\n해설  타동사 'need'의 목적어 자리 = 명사. (C) encouragement가 정답. (B) to encourage는 의미상 어색('격려하기를 필요로 하다'가 아닌 '격려를 필요로 하다').\n구조  부사 Sometimes + 주어 employees + 본동사 need + 목적어 encouragement + to부정사 to take risks and try new ways to solve problems.\n어휘  encouragement(격려), take risks(위험을 감수하다), solve problems(문제를 해결하다)\n팁  need + 명사 vs need + to부정사 의미 차이. 'need encouragement/support/help' 단골."]]},{"n":41,"ov":[7.5,5.687,9.375,5.132],"p":143},{"n":42,"ov":[7.5,5.687,9.375,5.132],"p":143,"q":[[11,4,2,"정답 (C) promoted\n해석  Camella Bard는 몇 달 전에 승진했다.\n해설  다음 문장에서 'her new role(그녀의 새 직책)'을 언급하므로 '승진'이 자연스럽다. (C) promoted가 정답.\n구조  주어 one of our sales representatives, Camella Bard + 본동사 was promoted(과거 수동태) + 시간 부사구 a few months ago.\n어휘  be promoted(승진하다), sales representative(영업 사원), a few months ago(몇 달 전)\n팁  be promoted = 승진하다. 새 직책/책임 부여 흐름의 단서.\n보기 뜻  (A) honored 영예를 받은 · (B) featured 특집된 · (C) promoted 승진된 · (D) discovered 발견된"],[12,4,3,"정답 (D) increased\n해석  그녀의 새로운 직책의 일환으로, 늘어난 영업 책임이 부여되었다.\n해설  명사 'sales responsibilities'를 수식하는 형용사 자리. 분사형 형용사 (D) increased가 정답.\n구조  전치사구 As part of her new role + 주어 she + 본동사 was given + 직접목적어 increased sales responsibilities.\n어휘  increased(증가한, 늘어난), sales responsibilities(영업 책임)\n팁  분사형 형용사 increased + 명사. 'increased responsibilities/duties' 단골."]]},{"n":43,"ov":[7.5,5.687,9.375,5.132],"p":143,"q":[[14,4,0,"정답 (A) Please let me know if you are able to contribute anything.\n해석  기여할 수 있는 것이 있으면 알려 주시기 바랍니다.\n해설  다음 문장 'I would appreciate the help(도움을 주시면 감사하겠다)'가 단서. 도움/기여 요청이 자연스럽게 이어지는 (A)가 정답. (D)는 'in two weeks(2주 후)' 복귀와 모순.\n구조  (A) 명령문 Please let me know + 조건절 if you are able to contribute anything.\n어휘  contribute(기여하다), let me know(알려 주다), appreciate the help(도움에 감사하다)\n팁  Part 6 문장 삽입: 다음 문장 'the help'를 자연스럽게 받는 보기. '도움 요청 → 감사 표현' 흐름 단골.\n보기 뜻  (A) Please let me know if you are able to contribute anything. 기여할 수 있는 것이 있으면 알려 주시기 바랍니다. · (B) The company has a lot to celebrate this year. 회사는 올해 축하할 일이 많다. · (C) Camella has worked for Brafford Tech for more than six years. Camella는 Brafford Tech에서 6년 이상 일해 왔다. · (D) We hope that Camella returns to the office within the year. Camella가 올해 안에 사무실로 돌아오기를 바란다."],[13,4,0,"정답 (A) also\n해석  저는 또한 그녀의 새 직책을 축하하고 그녀가 돌아올 때 사무실로 환영하기 위해 파티를 준비하고 있다.\n해설  앞에서 Camella의 승진과 가족 같은 존재라는 설명에 이어, 추가 행동(파티 준비)을 표현하는 부사가 자연스럽다. (A) also가 정답.\n구조  주어 I + 본동사 am also organizing + 목적어 a party + to부정사 to celebrate her new role and welcome her back to the office + 부사절 when she returns in two weeks.\n어휘  also(또한), organize a party(파티를 준비하다), celebrate(축하하다), welcome back(환영하다)\n팁  also = 추가 정보 부사. 동사 사이 자리(am + also + V-ing).\n보기 뜻  (A) also 또한 · (B) then 그때 · (C) therefore 따라서 · (D) nevertheless 그럼에도 불구하고"]]}]},{"k":"RC02","part":5,"kind":"unit","name":"RC Unit 02 명사","h":0.5633,"pg":[144,151],"s":[{"n":1,"ov":[9.141,6.796,86.797,71.845],"p":144},{"n":2,"ov":[5.703,11.373,65.391,5.825],"p":144},{"n":3,"ov":[4.375,12.483,73.516,76.144],"p":144},{"n":4,"ov":[3.281,12.483,15.156,57.836],"p":144},{"n":5,"ov":[7.422,5.687,17.578,5.132],"p":145,"q":[[1,2,1,"정답 (B) variety\n해석  다양한 기념품을 선물 가게에서 찾을 수 있다.\n해설  관사 'A' 뒤는 명사 자리. 'a variety of(다양한)'은 단골 표현. (B) variety가 정답. (A) various는 형용사.\n구조  주어 A variety of souvenirs + 본동사 can be found + 장소 부사구 in the gift shop.\n어휘  a variety of(다양한), souvenir(기념품), gift shop(선물 가게)\n팁  a variety/range/number of + 복수 명사 = 다양한/일정 범위의/많은. 비즈니스 단골."],[2,2,1,"정답 (B) signature\n해석  주문 양식 하단에 서명을 반드시 포함시켜 주십시오.\n해설  소유격 'your' 뒤는 명사 자리. (B) signature가 정답. (A) signed는 동사/분사.\n구조  명령문 Please remember to + 동사원형 include + 목적어 your signature + 장소 부사구 at the bottom of the order form.\n어휘  include(포함하다), signature(서명), order form(주문 양식)\n팁  소유격 + 명사. 'your signature/name/address' 단골."]]},{"n":6,"ov":[7.422,5.687,17.578,5.132],"p":145,"q":[[3,2,1,"정답 (B) operation\n해석  공연 중에는 카메라 작동이 금지된다.\n해설  관사 'The' 뒤는 명사 자리. (B) operation이 정답. (A) operate는 동사.\n구조  주어 The operation of cameras + 본동사 is prohibited + 시간 부사구 during the performance.\n어휘  operation(작동), prohibit(금지하다), performance(공연)\n팁  the + 명사 + of + 명사 = 'A의 B' 구조. 'the use/operation/control of'."],[4,2,0,"정답 (A) safety\n해석  안전상의 이유로, 공사 구역에 들어오는 사람은 안전모를 착용해야 한다.\n해설  전치사 'of' 뒤는 명사 자리. (A) safety가 정답. (B) safely는 부사.\n구조  전치사구 For reasons of safety + 주어 anyone entering the construction area + 본동사 must wear + 목적어 a hard hat.\n어휘  for reasons of(~상의 이유로), safety(안전), construction area(공사 구역), hard hat(안전모)\n팁  전치사 + 명사. 'reasons of safety/cost/efficiency' 단골."]]},{"n":7,"ov":[7.422,5.687,17.812,5.132],"p":145,"q":[[5,4,0,"정답 (A) report\n해석  지난달 보고서에 따르면, 이번 분기 소매 매출은 두 배가 될 것으로 예상된다.\n해설  소유격 'last month's' 뒤는 명사 자리. (A) report가 정답.\n구조  전치사구 According to last month's report + 주어 retail sales + 본동사 are expected to + 동사원형 double + 시간 부사 this quarter.\n어휘  according to(~에 따르면), retail sales(소매 매출), double(두 배가 되다), quarter(분기)\n팁  소유격 ~'s + 명사. 'last month's report/sales/data' 단골."]]},{"n":8,"ov":[7.422,5.687,17.812,5.132],"p":145,"q":[[6,4,0,"정답 (A) revision\n해석  편지에 서명하기 전에 6항에 대한 철저한 수정이 이루어져야 한다.\n해설  관사 'A' + 형용사 'thorough' 뒤는 명사 자리. (A) revision이 정답.\n구조  주어 A thorough revision of paragraph 6 + 본동사 should be made + 부사절 before the letter is signed.\n어휘  thorough revision(철저한 수정), paragraph(항, 단락), sign(서명하다)\n팁  관사 + 형용사 + 명사. 'a thorough/comprehensive/detailed + 명사' 단골."]]},{"n":9,"ov":[7.422,5.687,17.812,5.132],"p":145,"q":[[7,4,0,"정답 (A) drawing\n해석  Richbrock 미술관은 컬렉션에 매우 귀중한 그림 한 점을 보유하고 있다.\n해설  관사 'one' + 부사 'extremely' + 형용사 'valuable' 뒤는 명사 자리. (A) drawing(그림)이 정답.\n구조  주어 Richbrock Art Museum + 본동사 has + 목적어 one extremely valuable drawing + 부사구 in its collection.\n어휘  extremely valuable(매우 귀중한), drawing(그림), collection hose scientists directly involved in the research project + 본동사 are allowed to + 동사원형 enter + 목적어 the laboratory.\n어휘  scientist(과학자), directly involved in(~에 직접 참여한), be allowed to(~할 수 있다), laboratory(실험실)\n팁  those + 명사 + 분사구 = '~한 ~ 사람들'. those scientists involved in ~ 단골."]]},{"n":38,"ov":[7.422,5.825,8.75,4.716],"p":158,"q":[[7,4,2,"정답 (C) himself\n해석  Macropa 사의 회장은 회사의 좁아지는 이익률 원인을 조사하는 일을 스스로 떠맡았다.\n해설  'take it upon oneself to do(~을 스스로 떠맡다)'는 관용 표현. (C) himself가 정답.\n구조  주어 The president of Macropa, Inc. + 본동사 took it upon himself + to부정사 to investigate the reasons + 수식 for the company's narrowing profit margin.\n어휘  take it upon oneself to(스스로 떠맡다), investigate(조사하다), profit margin(이익률)\n팁  take it upon + 재귀대명사 + to부정사 = '~할 책임을 스스로 떠맡다' 관용."]]},{"n":39,"ov":[7.422,5.825,8.75,4.716],"p":158,"q":[[8,4,0,"정답 (A) our\n해석  최근 고객 피드백에 따르면 우리의 Galpran 신발 라인은 가볍고 합리적인 가격이다.\n해설  명사 'Galpran line of footwear' 수식 = 소유격. (A) our가 정답.\n구조  주어 Recent customer feedback + 본동사 shows + that절 [that our Galpran line of footwear is lightweight and affordable].\n어휘  customer feedback(고객 피드백), footwear(신발), lightweight(가벼운), affordable(합리적인 가격의)\n팁  소유격 + 고유명사 + 명사 = 'our Galpran/Vision/Apple + 명사' 브랜드 소개 단골."]]},{"n":40,"ov":[7.422,5.825,8.75,4.716],"p":158,"q":[[9,4,1,"정답 (B) their\n해석  등산객들은 언덕이 여러 개 있는 길을 선택함으로써 자신의 체력 수준을 향상시킬 수 있다.\n해설  명사 'level of fitness' 수식 = 소유격. (B) their가 정답.\n구조  주어 Hikers + 조동사 can + 본동사 improve + 목적어 their level of fitness + 수단 부사구 by choosing trails with several hills.\n어휘  hiker(등산객), improve(향상시키다), level of fitness(체력 수준), trail(길)\n팁  동사 + 소유격 + 명사. 'improve their performance/skill/level' 단골."]]},{"n":41,"ov":[7.422,5.825,8.75,4.716],"p":158,"q":[[10,4,1,"정답 (B) her own\n해석  자신의 선호를 제쳐 두고, Shang 씨는 다수가 선호하는 디자인을 승인했다.\n해설  명사 'preference' 수식 = 소유격 (강조형). 'her own preference(그녀 자신의 선호)'. (B) her own이 정답. (A) hers는 소유대명사로 명사 X.\n구조  분사구문 Putting her own preference aside + 주절 Ms. Shang approved the design favored by the majority.\n어휘  put aside(제쳐 두다), her own preference(그녀 자신의 선호), approve(승인하다), favored by(~이 선호하는), majority(다수)\n팁  소유격 + own + 명사 = '~ 자신의 ~'. 강조 표현."]]},{"n":42,"ov":[7.422,5.825,8.75,4.716],"p":159},{"n":43,"ov":[7.422,5.825,8.75,4.716],"p":159,"q":[[11,4,1,"정답 (B) orderly\n해석  건물을 차분하고 질서 있는 방식으로 나가 주시기 바랍니다.\n해설  안전 훈련 중 건물 대피 방식으로 'calm(차분한)'과 짝을 이루는 형용사는 'orderly(질서 있는)'. (B) orderly가 정답.\n구조  주어 you + 조동사 should + 본동사 exit + 목적어 the building + 부사구 in a calm, orderly manner.\n어휘  exit the building(건물을 나가다), in a calm, orderly manner(차분하고 질서 있는 방식으로)\n팁  calm and orderly = 안전 훈련 안내 단골 표현. 차분함과 질서가 짝궁.\n보기 뜻  (A) suspicious 의심스러운 · (B) orderly 질서 있는 · (C) previous 이전의 · (D) inward 안쪽의"],[12,4,3,"정답 (D) Please leave immediately from wherever you are in the building.\n해석  건물 어디에 있든 즉시 떠나 주세요.\n해설  앞 문장에서 '경보가 울리면 차분하고 질서 있게 건물을 나가라'고 했으므로, 즉시 대피 지시가 자연스럽다. (D) Please leave immediately가 정답. (A) 입장 시 안내(맥락 부적합), (B) 알람 시스템 제공자(부수 정보), (C) 무작위 시점(이번 훈련은 다음 주로 명시되어 있어 모순).\n구조  (D) 명령문 Please leave immediately + 부사구 from wherever you are in the building.\n어휘  leave immediately(즉시 떠나다), wherever you are(어디에 있든)\n팁  Part 6 문장 삽입: 앞 문장의 '건물 나가기' 지시를 강화하는 추가 안전 지침이 자연스러움.\n보기 뜻  (A) Security will give you a badge when you enter. 입장 시 보안 담당자가 배지를 줄 것이다. · (B) Vermer Alarms provided our new alarm system. Vermer Alarms가 새 경보 시스템을 제공했다. · (C) Safety drills are conducted at random times. 안전 훈련은 무작위 시간에 실시된다. · (D) Please leave immediately from wherever you are in the building. 건물 어디에 있든 즉시 떠나 주세요."]]},{"n":44,"ov":[7.422,5.825,8.75,4.716],"p":159,"q":[[14,4,2,"정답 (C) should take\n해석  전체 훈련은 단 몇 분밖에 걸리지 않을 것입니다.\n해설  안내문에서 미래 예상 시간을 표현. 'should take(~ 정도 걸릴 것이다, 예상)'. (C) should take가 정답. (A) took은 과거, (B) is taking은 현재진행, (D) could have taken은 과거 가정.\n구조  주어 The entire drill + 본동사 should take + 목적어 only a few minutes.\n어휘  entire drill(전체 훈련), should take(~ 정도 걸릴 것이다), a few minutes(몇 분)\n팁  should + 동사원형 = '~할 것이다'(예상/추정). 'It should take 5 minutes' 단골."]]}]},{"k":"RC04","part":5,"kind":"unit","name":"RC Unit 04 형용사","h":0.5633,"pg":[160,165],"s":[{"n":1,"ov":[8.438,6.935,79.922,65.187],"p":160},{"n":2,"ov":[3.438,11.512,77.031,80.166],"p":160},{"n":3,"ov":[3.281,11.512,76.953,82.94],"p":160},{"n":4,"ov":[7.422,5.825,16.797,4.993],"p":161,"q":[[1,2,0,"정답 (A) special\n해석  특별한 식사 요청이 있으시면, 항공편 예약 시 발권 담당자에게 말씀해 주십시오.\n해설  관사 'a' + ___ + 명사 'meal request'에서 명사 앞 수식어 = 형용사. (A) special이 정답.\n구조  조건절 If you have a special meal request + 주절 please tell the ticket agent + 부사절 when booking your flight.\n어휘  special(특별한), meal request(식사 요청), ticket agent(발권 담당자), book(예약하다)\n팁  관사 + 형용사 + 명사 = 가장 기본 형용사 위치. specialize(동사)와 헷갈리지 말 것."],[2,2,1,"정답 (B) successful\n해석  그 의류 가게는 좋은 품질의 유니폼을 경쟁력 있는 가격에 판매하기 때문에 성공적이다.\n해설  be 동사 보어 자리 = 형용사. (B) successful이 정답. (A) success는 명사.\n구조  주어 The clothing shop + 본동사 is + 보어 successful + 이유절 because it sells quality uniforms at competitive prices.\n어휘  successful(성공적인), quality(좋은 품질의), competitive prices(경쟁력 있는 가격)\n팁  be + 형용사 보어. 명사 success ≠ 형용사 successful 구분."]]},{"n":5,"ov":[7.422,5.825,16.797,4.993],"p":161,"q":[[3,2,1,"정답 (B) constructive\n해석  코디네이터들은 포커스 그룹에 건설적인 비판을 제공해 줄 것을 요청하고 있다.\n해설  명사 'criticism'을 수식하는 형용사 자리. 'constructive criticism(건설적인 비판)' 단골. (B) constructive가 정답.\n구조  주어 The coordinators + 본동사 are asking + 목적어 the focus groups + 목적격 보어 to provide constructive criticism.\n어휘  coordinator(코디네이터), focus group(포커스 그룹), constructive criticism(건설적인 비판)\n팁  constructive criticism = 비즈니스 단골. construction(건설/명사) vs constructive(건설적인/형용사)."],[4,2,0,"정답 (A) strategic\n해석  재무 부서는 전 직원 회의에서 전략적 성장 계획의 개요를 발표할 것이다.\n해설  소유격 'its' + ___ + 명사 'growth plans' 구조에서 명사 앞 수식 = 형용사. (A) strategic이 정답.\n구조  주어 The finance department + 본동사 will outline + 목적어 its strategic growth plans + 장소 부사구 at the all-staff meeting.\n어휘  finance department(재무 부서), outline(개요를 발표하다), strategic(전략적인), all-staff meeting(전 직원 회의)\n팁  소유격 + 형용사 + 명사 패턴. 형용사 strategic vs 부사 strategically 구분."]]},{"n":6,"ov":[7.422,5.825,17.031,4.993],"p":161,"q":[[5,4,2,"정답 (C) various\n해석  Centerville 도서관은 다음 달 지역사회를 위한 다양한 주제의 무료 수업 시리즈를 주최할 것이다.\n해설  명사 'subjects'를 수식하는 형용사. (C) various가 정답.\n구조  주어 Centerville Library + 본동사 will host + 목적어 a series of free classes + 부사구 about various subjects + 수혜자 for the community + 시간 부사 next month.\n어휘  host(주최하다), a series of(일련의), various subjects(다양한 주제), community(지역사회)\n팁  various + 복수 명사 = 다양한 ~. 'various subjects/topics/options' 단골."]]},{"n":7,"ov":[7.422,5.825,17.031,4.993],"p":161,"q":[[6,4,0,"정답 (A) popular\n해석  Pietro's Fine Ice Cream은 다양한 인기 있는 맛으로 이용 가능하다.\n해설  명사 'flavors'를 수식하는 형용사. (A) popular가 정답.\n구조  주어 Pietro's Fine Ice Cream + 본동사 is + 보어 available + 부사구 in a range of popular flavors.\n어휘  available(이용 가능한), a range of(다양한), popular flavors(인기 있는 맛)\n팁  a range of + 형용사 + 복수 명사 = 다양한 ~. popular는 -ar 형용사."]]},{"n":8,"ov":[7.422,5.825,17.031,4.993],"p":161,"q":[[7,4,2,"정답 (C) realistic\n해석  경영진이 설정한 매출 목표는 대부분의 직원에게 현실적으로 보인다.\n해설  seem 동사의 보어 자리 = 형용사. (C) realistic이 정답.\n구조  주어 The sales goal + 분사구 set by the management team + 본동사 seems + 보어 realistic + 부사구 to most of the staff.\n어휘  sales goal(매출 목표), management team(경영진), seem realistic(현실적으로 보이다)\n팁  seem/look/appear/become + 형용사 = 2형식. realistic vs realistically 구분."]]},{"n":9,"ov":[7.422,5.825,17.031,4.993],"p":161,"q":[[8,4,3,"정답 (D) collaborative\n해석  Sugiyama 박사의 현재 학술 연구는 행동 심리학에서의 협력 연구 프로젝트에 집중되어 있다.\n해설  명사 'research projects'를 수식하는 형용사. (D) collaborative(협력적인)가 정답.\n구조  주어 Dr. Sugiyama's current academic work + 본동사 is focused on + 목적어 collaborative research projects + 부사구 in behavioral psychology.\n어휘  academic work(학술 연구), collaborative(협력적인), research project(연구 프로젝트), behavioral psychology(행동 심리학)\n팁  collaborative + 명사 = 협력적인. -ive 어미는 대표적 형용사 어미."]]},{"n":10,"ov":[9.062,12.067,77.5,62.552],"p":162},{"n":11,"ov":[5.234,11.512,64.453,14.702],"p":162},{"n":12,"ov":[5.156,11.512,16.875,5.27],"p":162},{"n":13,"ov":[10.391,11.512,16.25,5.27],"p":162},{"n":14,"ov":[7.422,5.825,16.797,4.993],"p":163,"q":[[1,2,0,"정답 (A) Experienced\n해석  경험 많은 조립 라인 작업자들은 더 주의 깊은 경향이 있다.\n해설  사람 명사 'workers'는 경험을 '받은' 의미가 자연스러움. 'experienced(경험 많은)'. (A) Experienced가 정답.\n구조  주어 Experienced assembly-line workers + 본동사 tend to + 동사원형 be + 보어 more attentive.\n어휘  experienced(경험 많은), assembly-line worker(조립 라인 작업자), attentive(주의 깊은)\n팁  experienced + 사람 명사 = '경험 많은 ~'. -ed 분사형 형용사."],[2,2,1,"정답 (B) lasting\n해석  Moore 씨의 연설은 청중에게 지속적인 인상을 남겼다.\n해설  'lasting impression(오래 가는 인상)'은 단골 표현. (B) lasting이 정답.\n구조  주어 Mr. Moore's speech + 본동사 made + 목적어 a lasting impression + 부사구 on the audience.\n어휘  speech(연설), lasting impression(오래 가는 인상), audience(청중)\n팁  lasting/leading/promising/challenging = -ing 분사형 형용사. 통째 외우기."]]},{"n":15,"ov":[7.422,5.825,16.797,4.993],"p":163,"q":[[3,2,1,"정답 (B) impressed\n해석  콘서트의 모든 사람들이 Vincenzi 씨의 뛰어난 공연에 깊은 인상을 받았다.\n해설  주어 'Everyone'은 사람으로 감정을 '느끼는' 입장. 'be impressed by(~에 감명받다)'. (B) impressed가 정답.\n구조  주어 Everyone at the concert + 본동사 was impressed + 행위자 by Ms. Vincenzi's outstanding performance.\n어휘  be impressed by(~에 감명받다), outstanding performance(뛰어난 공연)\n팁  사람 + be impressed by/with = 감명받다. 사물 + be impressive = 인상적이다."],[4,2,0,"정답 (A) dedicated\n해석  Wellbeing Aid 사는 고객의 특정 요구를 충족시키는 데 전념하고 있다.\n해설  'be dedicated to(~에 전념하다)'는 토익 단골. (A) dedicated가 정답. (B) dedication은 명사.\n구조  주어 Wellbeing Aid, Inc. + 본동사 is dedicated + 전치사구 to meeting the specific needs of its customers.\n어휘  be dedicated to(~에 전념하다), specific needs(특정 요구)\n팁  be dedicated/committed/devoted to + 동명사 = 전념하다. to가 전치사이므로 -ing 형태."]]},{"n":16,"ov":[7.422,5.825,17.031,4.993],"p":163,"q":[[5,4,1,"정답 (B) favorable\n해석  농부들은 최근의 좋은 기상 조건의 결과로 풍작을 예상하고 있다.\n해설  명사 'weather conditions'를 수식하는 형용사. 'favorable weather(좋은 날씨)'. (B) favorable이 정답.\n구조  주어 Farmers + 본동사 are predicting + 목적어 good crop harvests + 부사구 as a result of recent favorable weather conditions.\n어휘  predict(예상하다), crop harvest(농작물 수확), favorable weather(좋은 날씨)\n팁  favorable weather/conditions/outcome = 좋은/유리한 ~. 형용사."]]},{"n":17,"ov":[7.422,5.825,17.031,4.993],"p":163,"q":[[6,4,1,"정답 (B) motivated\n해석  Winthrop Strategies는 일관되게 마감 기한을 지키는 의욕적인 사람을 고용하고자 한다.\n해설  관사 a + ___ + 명사 'individual'에서 명사 앞 수식 = 형용사. 'motivated individual(의욕적인 사람)'. (B) motivated가 정답.\n구조  주어 Winthrop Strategies + 본동사 is seeking to + 동사원형 employ + 목적어 a motivated individual + 관계절 who consistently meets deadlines.\n어휘  motivated(의욕적인), individual(개인), consistently(일관되게), meet deadlines(마감을 지키다)\n팁  motivated/qualified/dedicated/experienced + 사람 = 채용 광고 단골 형용사."]]},{"n":18,"ov":[7.422,5.825,17.031,4.993],"p":163,"q":[[7,4,1,"정답 (B) structural\n해석  사무실 건물 점검에서 몇 가지 사소한 결함이 드러났지만 구조적 손상은 없었다.\n해설  명사 'damage'를 수식하는 형용사. (B) structural이 정답.\n구조  주어 The office building inspection + 본동사 revealed + 목적어 some minor flaws + 등위 but no structural damage.\n어휘  inspection(점검), reveal(드러내다), minor flaws(사소한 결함), structural damage(구조적 손상)\n팁  structural damage = 구조적 손상. 건물 점검 단골."]]},{"n":19,"ov":[7.422,5.825,17.031,4.993],"p":163,"q":[[8,4,0,"정답 (A) reliable\n해석  새 프린터는 자주 수리해야 했던 이전 것보다 더 신뢰할 만하다.\n해설  비교 대상이 자주 고장난 프린터이므로 'reliable(신뢰할 만한)'이 자연스러움. (A) reliable이 정답.\n구조  주어 The new printer + 본동사 is + 보어 more reliable + 비교 대상 than the old one + 관계절 which had to be repaired frequently.\n어휘  reliable(신뢰할 만한), repair(수리하다), frequently(자주)\n팁  reliable = 신뢰할 만한(dependable과 동의어). 기계/제품 단골."]]},{"n":20,"ov":[7.422,5.825,8.75,4.716],"p":164,"q":[[1,4,0,"정답 (A) diverse\n해석  Harvey Street의 키오스크는 신문과 잡지의 다양한 선택을 제공한다.\n해설  명사 'selection'을 수식하는 형용사. (A) diverse가 정답.\n구조  주어 The kiosk on Harvey Street + 본동사 offers + 목적어 a diverse selection of newspapers and magazines.\n어휘  kiosk(키오스크), diverse selection(다양한 선택)\n팁  diverse + 명사 = 다양한 ~. 'a diverse selection/range of' 단골."]]},{"n":21,"ov":[7.422,5.825,8.75,4.716],"p":164,"q":[[2,4,2,"정답 (C) efficient\n해석  컨설턴트들은 3개월 이내에 더 효율적인 인력 계획이 시행될 것을 권고했다.\n해설  명사 'staffing plan'을 수식하는 형용사. (C) efficient가 정답.\n구조  주어 The consultants + 본동사 recommended + that절 [that a more efficient staffing plan be put in place within three months].\n어휘  consultant(컨설턴트), efficient(효율적인), staffing plan(인력 계획), be put in place(시행되다)\n팁  비교급 more + 형용사 + 명사. recommend that + 주어 + (should) + 동사원형 가정법."]]},{"n":22,"ov":[7.422,5.825,8.75,4.716],"p":164,"q":[[3,4,3,"정답 (D) competent\n해석  매우 유능한 경영진 덕분에, Wu Logistics는 올해 전례 없는 성장을 경험했다.\n해설  관사 a + 부사 highly + ___ + 명사 'management team' 구조. 형용사 (D) competent가 정답.\n구조  전치사구 Thanks to a highly competent management team + 주어 Wu Logistics + 본동사 has experienced + 목적어 unprecedented growth + 시간 부사 this year.\n어휘  competent(유능한), management team(경영진), unprecedented(전례 없는)\n팁  highly + 형용사 + 명사 = 매우 ~한. 'highly competent/qualified/experienced' 단골."]]},{"n":23,"ov":[7.422,5.825,8.75,4.716],"p":164,"q":[[4,4,0,"정답 (A) anxious\n해석  Patel 씨는 Haighton Industries 첫 출근일에 대해 불안해했지만, 모든 것이 매우 잘 진행되었다.\n해설  be + ___ + about 형태. 형용사 자리. 'be anxious about(~에 대해 불안한)'. (A) anxious가 정답.\n구조  주어 Ms. Patel + 본동사 was anxious + 전치사구 about her first day on the job at Haighton Industries + 등위절 but everything went extremely well.\n어휘  be anxious about(~에 대해 불안한), first day on the job(첫 출근일)\n팁  be + 형용사 + 전치사 단골. anxious about/concerned about/worried about 그룹."]]},{"n":24,"ov":[7.422,5.825,8.75,4.716],"p":164,"q":[[5,4,2,"정답 (C) registered\n해석  무료 조식은 등록된 투숙객을 위해 매일 오전 6시부터 9시 30분까지 제공된다.\n해설  명사 'guests'를 수식하는 형용사 자리. '등록된' 투숙객이 자연스러움. (C) registered가 정답.\n구조  주어 Complimentary breakfast + 본동사 is served + 부사 daily + 시간 부사구 from 6:00 a.m. to 9:30 a.m. + 수혜자 for registered guests.\n어휘  complimentary breakfast(무료 조식), registered guests(등록된 투숙객)\n팁  registered/qualified/authorized + 사람 = 등록된/자격 있는/승인된 ~. -ed 분사 형용사."]]},{"n":25,"ov":[7.422,5.825,8.75,4.716],"p":164,"q":[[6,4,1,"정답 (B) significant\n해석  Zach Hartvigsen의 최신 책은 현대 건축 역사에서 중요한 순간들을 탐구한다.\n해설  명사 'moments'를 수식하는 형용사. (B) significant가 정답.\n구조  주어 Zach Hartvigsen's latest book + 본동사 explores + 목적어 significant moments + 부사구 in the history of modern architecture.\n어휘  explore(탐구하다), significant moments(중요한 순간들), modern architecture(현대 건축)\n팁  significant + 명사 = 중요한 ~. 'significant role/change/impact' 단골."]]},{"n":26,"ov":[7.422,5.825,8.75,4.716],"p":164,"q":[[7,4,2,"정답 (C) promising\n해석  셀프 보관 업계는 현재 강화된 자동화를 위한 유망한 기술들을 테스트하고 있다.\n해설  명사 'technologies'를 수식하는 형용사. 'promising technologies(유망한 기술)'. (C) promising이 정답.\n구조  주어 The self-storage industry + 본동사 is currently testing + 목적어 promising technologies + 부사구 for enhanced automation.\n어휘  self-storage(셀프 보관), promising technologies(유망한 기술), enhanced automation(강화된 자동화)\n팁  promising = 유망한(-ing 분사형 형용사). 'promising candidate/career' 단골."]]},{"n":27,"ov":[7.422,5.825,8.75,4.716],"p":164,"q":[[8,4,1,"정답 (B) considerable\n해석  상당한 노력 끝에, 우리는 키보드를 재디자인하는 데 성공했다.\n해설  명사 'effort'를 수식하는 형용사. 'considerable effort(상당한 노력)'. considerate(사려 깊은)는 사람 수식이라 의미 부적합. (B) considerable이 정답.\n구조  전치사구 After considerable effort + 주어 we + 본동사 have succeeded in + 동명사 redesigning the keyboard.\n어휘  considerable(상당한), considerate(사려 깊은), effort(노력), succeed in(~에 성공하다), redesign(재디자인하다)\n팁  considerable(양·정도) vs considerate(사람의 성격). 헷갈리는 형용사 단골."]]},{"n":28,"ov":[7.422,5.825,8.75,4.716],"p":164,"q":[[9,4,2,"정답 (C) appreciative\n해석  소비자들은 그들이 받는 원치 않는 우편물의 양을 줄이려는 우리의 노력에 매우 감사해 왔다.\n해설  be + 부사 very + ___ + of 형태. 형용사 자리. 'be appreciative of(~에 감사하는)'. (C) appreciative가 정답.\n구조  주어 Consumers + 본동사 have been very appreciative of + 목적어 our efforts + to부정사 to reduce the amount of unsolicited mail + 관계절 that they receive.\n어휘  be appreciative of(~에 감사하는), unsolicited mail(원치 않는 우편물)\n팁  be appreciative of + 명사 = 감사하다. -ive 어미 형용사."]]},{"n":29,"ov":[7.422,5.825,8.75,4.716],"p":164,"q":[[10,4,2,"정답 (C) persuasive\n해석  재제조된 알레르기 약이 기존 약보다 더 효과적이라는 설득력 있는 증거는 없다.\n해설  명사 'evidence'를 수식하는 형용사. (C) persuasive가 정답.\n구조  주어 There is no persuasive evidence + 동격절 that the reformulated allergy medication is any more effective than the existing one.\n어휘  persuasive evidence(설득력 있는 증거), reformulated(재제조된), allergy medication(알레르기 약), existing(기존의)\n팁  persuasive + 명사 gned(새로 디자인된), mobile app(모바일 앱)\n팁  Part 6 문장 삽입: 다음 문장의 'our app'을 자연스럽게 미리 언급하는 보기. 웹사이트→앱 추가 안내 흐름.\n보기 뜻  (A) It is our privilege to be your wireless services provider. 귀하의 무선 서비스 제공자가 되어 영광이다. · (B) This information will provide you with additional examples. 이 정보는 추가 예시를 제공할 것이다. · (C) We have rescheduled the due date for your next payment. 다음 결제일을 변경했다. · (D) You can also access your account on our newly redesigned mobile app. 새로 디자인된 모바일 앱에서도 계정에 접속할 수 있다."]]}]},{"k":"RC06","part":5,"kind":"unit","name":"RC Unit 06 동사의 형태와 종류","h":0.5633,"pg":[172,177],"s":[{"n":1,"ov":[8.438,6.935,85.859,65.326],"p":172},{"n":2,"ov":[5.0,11.512,79.297,66.297],"p":172},{"n":3,"ov":[3.359,11.512,54.219,79.75],"p":172},{"n":4,"ov":[3.359,11.512,33.203,48.544],"p":172},{"n":5,"ov":[3.359,11.512,33.359,23.44],"p":172},{"n":6,"ov":[7.422,5.825,17.344,4.993],"p":173,"q":[[1,2,1,"정답 (B) leave\n해석  외출하실 때 호텔 키를 프런트 데스크에 맡겨 주십시오.\n해설  Please로 시작하는 명령문은 동사원형이 와야 한다. (B) leave가 정답. (A) to leave는 부정사로 본동사 불가.\n구조  명령문 Please leave your hotel key + 장소 부사구 at the front desk + 부사절 when you go out.\n어휘  front desk(프런트 데스크), go out(외출하다)\n팁  Please + 동사원형 = 명령문. 'Please' 뒤에는 무조건 동사원형."],[2,2,1,"정답 (B) be viewed\n해석  Jee-Soo Lee의 최신 강의를 온라인에서 볼 수 있다.\n해설  조동사 can 뒤이고 강의는 보여지는 대상(수동). 'can be + p.p.' 형태. (B) be viewed가 정답.\n구조  주어 The latest lecture by Jee-Soo Lee + 본동사 can be viewed(조동사+수동태) + 부사 online.\n어휘  the latest(최신의), lecture(강의), view(보다)\n팁  조동사(can/should/must) + be + p.p. = 수동태. 통째로 외우기."]]},{"n":7,"ov":[7.422,5.825,17.344,4.993],"p":173,"q":[[3,2,1,"정답 (B) is offering\n해석  Darlingstone Hotel은 모든 투숙객에게 무료 조식을 제공하고 있다.\n해설  본동사 자리이므로 -ing 단독 불가. 현재진행 (B) is offering이 정답.\n구조  주어 The Darlingstone Hotel + 본동사 is offering(현재진행) + 목적어 a complimentary breakfast + 부사구 to all of its guests.\n어휘  complimentary(무료의), guest(투숙객)\n팁  -ing 단독은 본동사 불가. 'is/are/was/were + -ing' 또는 'be V-ing' 형태로만 본동사."],[4,2,0,"정답 (A) received\n해석  Hu 씨의 혁신적인 아이디어는 Bercier Group의 마케팅 직원들에게 열렬히 받아들여졌다.\n해설  be 동사 iness(인쇄 사업), 25 years ago(25 년 전)\n팁  ~ ago 는 100% 과거 시제 신호. 'will/현재완료'는 ago 와 결합 불가."],[2,2,0,"정답 (A) hires\n해석  Zellacor Software 사는 자주 IT 전문가들을 채용한다.\n해설  'frequently(자주)'은 반복적 행위로 현재 시제 단서. 주어가 단수(회사명, 고유명사)이므로 단수 현재 동사 (A) hires 가 정답. (B) hiring 은 본동사 불가.\n구조  주어 Zellacor Software, Inc.(단수) + 부사 frequently + 본동사 hires + 목적어 information technology specialists.\n어휘  frequently(자주), hire(채용하다), information technology specialist(IT 전문가)\n팁  frequently/often/regularly/always = 현재 시제 단서. 회사명은 고유명사로 단수 취급."]]},{"n":6,"ov":[7.422,5.687,17.578,5.132],"p":185,"q":[[3,2,0,"정답 (A) will be\n해석  회사 만찬은 이번 주 토요일 Royal Hotel 에서 열릴 것이다.\n해설  'this coming Saturday(이번 주 토요일)'은 미래 시점 단서. 따라서 (A) will be(미래 수동태)가 정답. (B) has been 은 현재완료로 미래 부사와 결합 불가.\n구조  주어 The company dinner party + 본동사 will be held(미래 수동태) + 시간 부사 this coming Saturday + 장소 부사구 at Royal Hotel.\n어휘  company dinner party(회사 만찬), this coming Saturday(이번 주 토요일)\n팁  this coming + 요일/시기 = 미래 시점. will/be going to 와 결합."],[4,2,0,"정답 (A) was presented\n해석  그 상은 어젯밤 만찬에서 Hiroshi Suzuki 에게 수여되었다.\n해설  'last night(어젯밤)'은 명확한 과거 시점이며, 상은 수여되는 대상(수동)이므로 (A) was presented(과거 수동태)가 정답. (B) has presented 는 ⓐ 능동이고 ⓑ 현재완료라 last 와 결합 불가.\n구조  주어 The award + 본동사 was presented(과거 수동태) + 부사구 to Hiroshi Suzuki + 시간 부사 at last night's dinner.\n어휘  award(상), present(수여하다), last night's dinner(어젯밤 만찬)\n팁  last + 시점 = 과거 시점. 'has p.p.'와 결합 불가가 단골 함정."]]},{"n":7,"ov":[7.422,5.687,17.812,5.132],"p":185,"q":[[5,4,3,"정답 (D) closed\n해석  Ellory Avenue 의 상점들은 작업자들이 도로를 재포장할 수 있도록 어제 일찍 문을 닫았다.\n해설  'yesterday(어제)'는 과거 시점. 능동/수동 판단: businesses 가 능동으로 문을 닫는 행위이고 빈칸 뒤 부사 early 가 있어 능동 과거 (D) closed 가 정답. (A) are closed 는 현재 수동, (B)/(C)는 본동사 불가.\n구조  주어 Businesses on Ellory Avenue + 본동사 closed(과거 능동) + 부사 early + 시간 부사 yesterday + 부정사 to allow work crews to repave the street.\n어휘  Avenue(거리), early(일찍), yesterday(어제), work crew(작업반), repave(재포장하다)\n팁  close 는 자동사·타동사 모두 가능. 가게가 문을 닫다 = 자동사 능동. 'yesterday → 과거형'."]]},{"n":8,"ov":[7.422,5.687,17.812,5.132],"p":185,"q":[[6,4,2,"정답 (C) allows\n해석  현재 시스템은 사용자들이 비밀번호를 입력하여 온라인 뱅킹 계좌에 접근할 수 있도록 허용한다.\n해설  'current(현재의)'는 현재 시제 단서. 주어 'The current system'은 단수이므로 단수 현재 (C) allows 가 정답.\n구조  주어 The current system(단수) + 본동사 allows + 목적어 users + 목적격 보어 to access their online banking accounts + 수단 부사구 by entering a password.\n어휘  current(현재의), allow A to(A 가 ~하도록 허용하다), online banking account(온라인 뱅킹 계좌)\n팁  current/currently/at present = 현재 시제 단서. allow + O + to 부정사 5 형식."]]},{"n":9,"ov":[7.422,5.687,17.812,5.132],"p":185,"q":[[7,4,0,"정답 (A) will come\n해석  모든 Engbert Appliance 제품에 대한 새 주문 절차가 다음 달부터 시행될 것이다.\n해설  'as of next month(다음 달부터)'은 미래 시점. 따라서 미래 시제 (A) will come 이 정답.\n구조  주어 A new ordering process for all Engbert Appliance products + 본동사 will come(미래) + 부사구 into effect + 시간 부사구 as of next month.\n어휘  ordering process(주문 절차), come into effect(시행되다), as of(~부터)\n팁  as of/effective + 미래 시점 = 미래 시제 신호. 'as of + 과거 시점'도 가능(~부터로 동일 의미)."]]},{"n":10,"ov":[7.422,5.687,17.812,5.132],"p":185,"q":[[8,4,0,"정답 (A) listed\n해석  작년에 Hansford Automobile 카탈로그는 모든 차량의 표준 사양으로 에어컨을 명시했다.\n해설  'Last year(작년)'은 과거 시점. 따라서 과거 시제 (A) listed 가 정답.\n구조  시간 부사 Last year + 주어 the Hansford Automobile catalog + 본동사 listed(과거) + 목적어 air-conditioning + 보어 as a standard feature in all automobiles.\n어휘  automobile(자동차), catalog(카탈로그), list(명시하다), air-conditioning(에어컨), standard feature(표준 사양)\n팁  Last + 시점 = 과거. 'last year/month/week' 모두 과거 시제."]]},{"n":11,"ov":[9.609,11.928,11.875,6.103],"p":186},{"n":12,"ov":[3.359,11.373,30.312,34.813],"p":186},{"n":13,"ov":[5.391,11.373,27.812,5.825],"p":186},{"n":14,"ov":[5.547,11.373,25.078,5.825],"p":186},{"n":15,"ov":[7.422,5.687,17.578,5.132],"p":187,"q":[[1,2,0,"정답 (A) are\n해석  오버부킹으로 인해 일부 Telco Bus 승객들은 현재 다섯 시간 넘게 기다리고 있다.\n해설  'now(지금)'은 현재 시제 단서. 빈칸 뒤 'waiting'으로 현재진행 형태. (A) are 가 정답.\n구조  원인 부사구 Due to overbooking + 주어 some Telco Bus passengers + 본동사 are now waiting(현재진행) + 부사구 over five hours.\n어휘  overbooking(오버부킹, 초과 예약), passenger(승객)\n팁  n 1,"q":[[11,4,1,"정답 (B) Fortunately\n해석  다행히, 화재가 빠르게 진압되어 피해는 미미하다.\n해설  화재 발생이라는 부정적 사건 후 '피해가 미미하다'는 긍정적 결과를 연결하는 부사로 'Fortunately(다행히)'가 자연스럽다. (B) Fortunately 가 정답.\n구조  부사 Fortunately + 주절 the fire was contained quickly + 결과절 so the damage is minimal.\n어휘  fortunately(다행히), contain(진압하다, 억제하다), minimal(미미한)\n팁  Part 6 어휘: 글의 정서적 흐름을 잡는 부사. 부정적 사건 → 긍정적 마무리에는 Fortunately/Luckily.\n보기 뜻  (A) Repeatedly 반복적으로 · (B) Fortunately 다행히 · (C) Normally 보통 · (D) Kindly 친절하게"],[12,4,3,"정답 (D) unavailable\n해석  그러나 오늘 간이 주방과 테이블은 사용할 수 없다.\n해설  화재 후 시설을 점검하는 맥락에서 'unavailable(이용 불가능한)'이 자연스럽다. (D) unavailable 이 정답. However(그러나)도 단서.\n구조  역접 부사 However + 주어 the kitchenette and tables + 본동사 are + 보어 unavailable + 시간 부사 today.\n어휘  kitchenette(간이 주방), unavailable(이용 불가능한)\n팁  However + 부정적 변화 = '그러나 ~ 못한다'. unavailable 의 짝궁.\n보기 뜻  (A) arranged 정돈된 · (B) incomplete 불완전한 · (C) furnished 갖춰진 · (D) unavailable 이용 불가능한"]]},{"n":44,"ov":[7.5,5.687,9.375,5.132],"p":191,"q":[[14,4,0,"정답 (A) has been authorized\n해석  여러분이 간이 주방을 정기적으로 이용하는지 여부와 관계없이, 여러분의 매니저는 회사 카페테리아에서 무료 다과 쿠폰을 배부할 권한을 부여받았다.\n해설  매니저는 권한을 '부여받는' 대상이므로 수동태가 필요하다. 화재 후 현재 권한이 부여된 상태를 나타내므로 현재완료 수동태 (A) has been authorized 가 정답.\n구조  양보절 Regardless of whether you use the kitchenette regularly + 주절 your manager has been authorized + to 부정사 to distribute vouchers for free refreshments at the company cafeteria.\n어휘  regardless of(~에 관계없이), authorize A to(A 에게 ~할 권한을 주다), distribute(배부하다), voucher(쿠폰), refreshments(다과)\n팁  be authorized to + 동사원형 = ~할 권한을 부여받다. 현재까지 영향이 있는 권한 = 현재완료 수동."],[13,4,2,"정답 (C) When they are done, the space will be cleaned thoroughly.\n해석  그들이 작업을 마치면, 그 공간은 철저히 청소될 것이다.\n해설  앞 문장에서 'Electricians arrived ... to inspect and replace the wiring(전기 기사들이 배선 점검·교체를 위해 도착)'을 언급했으므로, 'they(=Electricians)'가 작업을 마친 후 청소된다는 흐름이 자연스럽다. (C)가 정답.\n구조  (C) 부사절 When they are done + 주절 the space will be cleaned thoroughly(미래 수동태).\n어휘  be done(끝나다), thoroughly(철저히), clean(청소하다)\n팁  Part 6 문장 삽입: 'they(=Electricians)'를 자연스럽게 받는 보기. 작업 후 결과를 안내하는 흐름.\n보기 뜻  (A) A new restaurant has just opened a mere block from our office. 사무실에서 한 블록 거리에 새 식당이 문을 열었다. · (B) There is not enough money in the budget for this. 예산에 이를 위한 돈이 충분하지 않다. · (C) When they are done, the space will be cleaned thoroughly. 그들이 작업을 마치면, 그 공간은 철저히 청소될 것이다. · (D) Please let your manager know if you can attend the team luncheon. 팀 오찬 참석 가능 여부를 매니저에게 알려 주세요."]]}]},{"k":"RC09","part":5,"kind":"unit","name":"RC Unit 09 능동태와 수동태","h":0.5633,"pg":[192,197],"s":[{"n":1,"ov":[8.672,6.796,88.906,65.465],"p":192},{"n":2,"ov":[3.438,11.373,80.859,29.82],"p":192},{"n":3,"ov":[3.438,11.373,83.75,88.627],"p":192},{"n":4,"ov":[3.906,11.373,92.266,78.363],"p":192},{"n":5,"ov":[7.422,5.687,38.047,58.252],"p":193,"q":[[1,2,0,"정답 (A) submit\n해석  그 직책에 지원하는 후보자들은 월말까지 지원서를 제출해야 한다.\n해설  빈칸 뒤에 목적어 'their applications'가 있으므로 능동태가 정답이다. 후보자가 직접 지원서를 제출하는 행위이므로 능동태 (A) submit. 조동사 must 뒤에는 동사원형이 와야 함.\n구조  주어 Candidates + 수식 for the position + 조동사 must + 본동사 submit + 목적어 their applications + 시간 부사구 by the end of the month.\n어휘  candidate(후보자), submit(제출하다), application(지원서), by the end of(~의 말까지)\n팁  능동/수동 판별 1 순위 단서: 빈칸 뒤 목적어 유무. 목적어가 보이면 능동, 없으면 수동을 의심하세요. 또한 must 같은 조동사 뒤는 무조건 동사원형."],[2,2,1,"정답 (B) attached\n해석  디자인 상에 후보로 지명된 엔지니어 명단이 이 이메일에 첨부되어 있다.\n해설  주어 'A list'는 첨부되는 대상이며 빈칸 뒤에 목적어가 없고 전치사(to)가 바로 이어지므로 수동태가 정답. (B) attached 가 정답으로 'is attached(첨부되어 있다)'가 됨. (A) attaching 은 능동 진행형으로 의미가 안 맞음.\n구조  주어 A list + 수식 of engineers + 분사구 nominated for a design award + 본동사 is attached(현재 수동태) + 부사구 to this e-mail.\n어휘  nominate(지명하다, 추천하다), award(상), be attached to(~에 첨부되다)\n팁  be attached to / be enclosed with / be included in 같은 '~에 포함/첨부되다'는 비즈니스 영어에서 매우 자주 등장하는 수동태 패턴."]]},{"n":6,"ov":[7.422,5.687,38.125,65.881],"p":193,"q":[[3,2,1,"정답 (B) written\n해석  요청된 정보는 제공된 공간에 신중히 작성되어야 한다.\n해설  should be 뒤에 와야 하므로 p.p.가 필요하다. 정보(information)가 작성되는 대상이므로 수동태 (B) written 이 정답. (A) writing 은 진행형 -ing.\n구조  주어 The requested information + 조동사 should + 수동태 be written + 부사 carefully + 장소 부사구 in the space provided. 'space provided'는 '제공된 공간'(과거분사 수식).\n어휘  requested(요청된), carefully(신중히), provided(제공된), space provided(제공된 공간)\n팁  조동사 + be + p.p.는 수동태의 단골 형태. 'should be written, must be completed, can be found' 등 통째로 익히게 하세요."],[4,2,1,"정답 (B) by\n해석  그 세미나는 식품 서비스 산업의 전문가들이 참석할 것이다.\n해설  수동태 'will be attended' 다음에 행위자(참석하는 사람)를 나타내야 하므로 'by + 행위자'가 자연스럽다. (B) by 가 정답. attend 는 타동사이며 by + 사람으로 행위자를 표시.\n구조  주어 The seminar + 본동사 will be attended(미래 수동태) + 행위자 by professionals + 수식 in the food service industry.\n어휘  attend(참석하다), professional(전문가), food service industry(식품 서비스 업계)\n팁  수동태에서 행위자는 보통 'by + 사람'. 단, 일부 동사는 다른 전치사: be interested in, be satisfied with, be known for/to/as 등 - 이는 유형 2 에서 다룸."]]},{"n":7,"ov":[7.422,5.687,17.812,49.515],"p":193,"q":[[5,4,3,"정답 (D) had to postpone\n해석  항공사 파업 때문에 Jarvela 씨는 로마로 여행할 계획을 미뤄야 했다.\n해설  빈칸 뒤에 목적어 'his plans'가 있으므로 능동태 본동사가 필요하다. (A) postponing 과 (B) to postpone 은 본동사 불가, (C) should be postponed 는 수동태로 목적어와 결합 불가. 따라서 능동 본동사 (D) had to postpone 이 정답.\n구조  원인 부사구 Due to the airline strike + 주어 Mr. Jarvela + 본동사 had to postpone + 목적어 his plans + 부정사 to travel to Rome.\n어휘  airline strike(항공사 파업), postpone(연기하다, 미루다), have to + 동사원형(~해야 하다)\n팁  had to + V 는 'must 의 과거형' 의미. 빈칸 뒤에 목적어가 있으면 무조건 능동태이고, '본동사 형태'로 보기를 추리는 게 핵심."]]},{"n":8,"ov":[7.422,5.687,17.812,34.535],"p":193,"q":[[6,4,0,"정답 (A) shipped\n해석  우리 품질 관리부는 모든 제품이 소매업체로 배송되기 전에 그것들을 검사한다.\n해설  before 절의 주어 they(=products)는 배송되는 대상이며 빈칸 뒤에 전치사 to 가 이어지므로 수동태 'are + p.p.'가 필요. (A) shipped 가 정답. (B) shipment 는 명사, (C) ships 는 단수 동사, (D) shipping 은 진행형으로 부적합.\n구조  주절 Our quality control department tests all products + 부사절 before they are shipped to retailers(주어+수동태+전치사구).\n어휘  quality control department(품질 관리부), ship(배송하다), retailer(소매업체)\n팁  be + p.p. 다음에 전치사가 바로 이어지면 수동태 확률 매우 높음. 또한 ship 은 동사로도 자주 쓰이는 비즈니스 어휘."]]},{"n":9,"ov":[7.422,5.687,17.812,49.515],"p":193,"q":[[7,4,3,"정답 (D) was released\n해석  그 도시의 기차 시스템에 관한 보고서는 지난 화요일에 대중에게 공개되었다.\n해설  주어 'The report'는 공개되는 대상이고, 'last Tuesday'는 명확한 과거 시점이므로 과거 수동태 (D) was released 가 정답. (A) to release 는 부정사, (B) have released 는 능동 현재완료 + 명확한 과거 부사 결합 불가, (C) is releasing 은 능동 현재진행으로 부적절.\n구조  주어 The report + 수식 on the city's train system + 본동사 was released(과거 수동태) + 수혜 부사구 to the public + 시간 부사 last Tuesday.\n어휘  report(보고서), train system(기차 시스템), release(공개하다, 발표하다), public(대중)\n팁  report, document, information 은 수동태 단골. 또한 last + 시점 = 과거 시제 시그널로 'have p.p.' 형태 즉시 제거."]]},{"n":10,"ov":[7.422,5.687,17.812,27.046],"p":193,"q":[[8,4,0,"정답 (A) is posted\n해석  최신 채용 정보 목록이 Island Hopper 의 웹페이지에 게시되어 있다.\n해설  주어 'An updated list'는 단수이며 게시되는 대상이므로 단수 수동태가 필요. (A) is posted 가 정답. (B) posting 은 본동사 불가, (C) are posting 은 복수 능동, (D) post 는 복수.\n구조  주어 An updated list + 수식 of job opportunities + 본동사 is posted(현재 수동태) + 장소 부사구 on Island Hopper's Web page.\n어휘  updated(최신의, 업데이트된), job opportunity(채용 기회), post(게시하다)\n팁  list, schedule, notice 같은 정보 자료는 'is posted/announced/displayed' 같은 수동태가 자연스러움."]]},{"n":11,"ov":[9.453,11.928,82.109,35.229],"p":194},{"n":12,"ov":[3.359,11.373,91.562,21.359],"p":194},{"n":13,"ov":[3.281,11.234,81.641,55.479],"p":194},{"n":14,"ov":[5.391,11.373,23.281,5.548],"p":194},{"n":15,"ov":[7.422,5.687,38.281,63.107],"p":195,"q":[[1,2,1,"정답 (B) covers\n해석  회사 안내서는 보상, 보너스, 그리고 초과 근무 주제를 다룬다.\n해설  빈칸 뒤에 목적어 'the topics of...'가 있으므로 능동태가 필요. 주어가 단수(handbook)이므로 단수 능동태 (B) covers 가 정답.\n구조  주어 The company handbook(단수) + 본동사 covers(능동 현재) + 목적어 the topics of compensation, bonuses, and overtime.\n어휘  handbook(안내서, 핸드북), cover(다루다, 포함하다), compensation(보상), overtime(초과 근무)\n팁  cover 는 '다루다, 포괄하다'의 의미로 비즈니스 영어에서 매우 자주 쓰임. 'A covers B'는 'A 가 B 를 포괄/다룬다'."],[2,2,0,"정답 (A) is made\n해석  소형 보트용 최고의 트레일러는 Tow-Well Manufacturing 사에 의해 만들어진다.\n해설  빈칸 뒤에 'by + 행위자'가 이어지므로 수동태가 자연스럽다. (A) is made 가 정답. trailer 는 만들어지는 대상.\n구조  주어 The best trailer + 수식 for small boats + 본동사 is made(현재 수동태) + 행위자 by Tow-Well Manufacturing.\n어휘  trailer(트레일러), boat(보트), manufacturing(제조업)\n팁  수동태 + by + 행위자 = 가장 기본 형태. 또한 제품(product, item, trailer) 주어는 수동태 default."]]},{"n":16,"ov":[7.422,5.687,38.125,70.458],"p":195,"q":[[3,2,1,"정답 (B) be developed\n해석  더 나은 마케팅 전략은 언제든 개발될 수 있다.\n해설  조동사 can 뒤에는 동사원형. 또한 strategies 는 개발되는 대상이며 빈칸 뒤에 목적어가 없으므로 수동태 (B) be developed 가 정답.\n구조  주어 Better marketing strategies + 조동사 can + 부사 always + 본동사 be developed(수동태 원형).\n어휘  marketing strategy(마케팅 전략), develop(개발하다)\n팁  조동사(can/should/must) + be + p.p. = 가능/의무의 수동태. 빈칸 뒤가 비어있는 것도 수동태 시그널."],[4,2,1,"정답 (B) with\n해석  디자이너와 사진작가 모두 가을 카탈로그에 만족해 한다.\n해설  'be satisfied with'는 '~에 만족하다'라는 고정 표현이므로 (B) with 가 정답.\n구조  주어 Both the designers and photographers(복수) + 본동사 are satisfied(현재 수동태) + 전치사구 with the fall catalog.\n어휘  be satisfied with(~에 만족하다), fall catalog(가을 카탈로그)\n팁  수동태 + 전치사 표현은 통암기 필수. be satisfied with / be pleased with / be happy with 는 같은 의미."]]},{"n":17,"ov":[7.422,5.687,17.812,41.886],"p":195,"q":[[5,4,1,"정답 (B) distributing\n해석  Ling 씨는 수정된 일정표를 게스트 연사들뿐만 아니라 쇼 진행자에게도 배부하고 있다.\n해설  빈칸 뒤에 목적어 'a revised schedule'이 있으므로 능동태가 필요. is + -ing 형태인 (B) distributing 이 정답으로 현재진행. (A)는 원형, (C)는 단수 단순현재 + is 중복, (D)는 수동태 의미 불일치.\n구조  주어 Mr. Ling + 본동사 is distributing(현재진행 능동) + 목적어 a revised schedule + 부사구 to the show's host as well as to the guest speakers.\n어휘  revised(수정된), schedule(일정표), distribute(배부하다), as well as(~뿐만 아니라), guest speaker(초청 연사)\n팁  is/are + V-ing(능동 진행) vs is/are + p.p.(수동) 구분 핵심: 빈칸 뒤 목적어 유무. A as well as B 는 'A as well as B'가 주어이면 동사는 A 에 일치."]]},{"n":18,"ov":[7.422,5.687,17.812,34.674],"p":195,"q":[[6,4,0,"정답 (A) in\n해석  다수의 팀원들이 다가오는 워크숍에 관심이 있다.\n해설  'be interested in'은 '~에 관심이 있다'는 고정 표현이므로 (A) in 이 정답.\n구조  주어 A large number of team members + 본동사 are interested + 전치사구 in the upcoming workshop. 'A large number of + 복수명사'는 복수 동사를 취함.\n어휘  be interested in(~에 관심이 있다), upcoming(다가오는), workshop(워크숍)\n팁  수동태 + 전치사 패턴 다시 강조: in 은 interested/engaged/involved. 또한 a large number of(많은) + 복수 = 복수 동사."]]}, 7],"p":205},{"n":42,"ov":[11.172,5.825,4.922,74.202],"p":205,"q":[[11,4,2,"정답 (C) Yet, finding space for everything you want to grow can be a struggle.\n해석  그러나 키우고 싶은 모든 것을 위한 공간을 찾는 일은 어려울 수 있다.\n해설  글의 제목 'Growing a Garden in Limited Space(한정된 공간에서 정원 가꾸기)'와 빈칸 뒤 'To save space(공간을 절약하려면)'이 핵심 단서. '공간 부족' 문제를 제시한 (C)가 다음 문장의 '공간 절약' 해결책과 자연스럽게 연결된다. (A) 토마토 일반론, (B) 시간 소요, (D) 작물 선택은 흐름과 무관.\n구조  (C) Yet(역접 부사) + 주어 finding space for everything you want to grow(동명사 주어) + 본동사 can be + 보어 a struggle.\n어휘  yet(그러나), struggle(어려움), find space(공간을 찾다)\n팁  Part 6 문장 삽입: 글의 핵심 주제(한정된 공간) + 다음 문장 해결책(공간 절약) 사이에 들어가야 할 내용은 '문제 제기'.\n보기 뜻  (A) Tomato plants are commonly found in home gardens. 토마토 식물은 가정 정원에서 흔히 발견된다. · (B) Gardening can be very time-consuming. 정원 가꾸기는 매우 시간이 많이 걸린다. · (C) Yet, finding space for everything you want to grow can be a struggle. 그러나 키우고 싶은 모든 것을 위한 공간을 찾는 일은 어려울 수 있다. · (D) Deciding what to grow is an essential part of the process. 무엇을 키울지 결정하는 것은 과정의 필수적인 부분이다."],[12,4,2,"정답 (C) for example\n해석  예를 들어 부시빈스(덤불콩)는 빨리 자라며, 더 느리게 자라는 식물인 토마토 사이에 심을 수 있다.\n해설  앞 문장에서 '다른 식물을 함께 심을 수 있다'는 일반론을 제시했고, 빈칸 문장은 그 구체적인 예시(부시빈스)이므로 (C) for example 이 정답. (A) however(역접), (B) as a result(결과), (D) on the other hand(대조)는 의미 부적합.\n구조  주어 Bush beans + 콤마 + 삽입 부사 for example + 본동사 are fast growers + 등위절 and can be planted between tomatoes + 동격 a slower-growing plant.\n어휘  bush bean(덤불콩, 부시빈스), fast grower(빨리 자라는 식물), plant(심다)\n팁  예시 연결사: for example/for instance/such as. 일반론 다음 구체적 예시가 등장할 때 사용.\n보기 뜻  (A) however 그러나 · (B) as a result 결과적으로 · (C) for example 예를 들어 · (D) on the other hand 반면에"]]},{"n":43,"ov":[10.859,5.825,5.234,66.99],"p":205,"q":[[14,4,1,"정답 (B) to continue\n해석  이렇게 하면 토마토가 계속 자랄 수 있는 공간이 생기고 토양에 귀중한 영양분이 남게 된다.\n해설  'create room/space for + 사람 + to 부정사 = ~가 ~할 수 있는 공간을 만들다' 구조. (B) to continue 가 정답. (A) continuing 은 분사로 'tomatoes growing'과 의미 어색, (C)/(D)는 본동사 형태로 부적합.\n구조  주어 This + 본동사 will create + 목적어 room + 수식 for the tomatoes + to 부정사 to continue growing + 등위절 and leave valuable nutrients in the soil.\n어휘  create room for(~을 위한 공간을 만들다), continue -ing(계속 ~하다), valuable(귀중한), nutrient(영양분), soil(토양)\n팁  create/make room/space for A to do = A 가 ~할 수 있는 공간을 만들다. 또한 continue 는 to 부정사·동명사 모두 가능."],[13,4,3,"정답 (D) extra\n해석  추가로 심은 식물(콩)은 토마토가 성장하는 동안 잡초가 자라는 것을 막아 준다.\n해설  앞 문장에서 토마토 사이에 부시빈스를 추가로 심는다고 했으므로 'extra plants(추가로 심은 식물)'이 가장 자연스럽다. (D) extra 가 정답. (A) natural(자연의), (B) colorful(다채로운), (C) rare(드문)는 문맥과 맞지 않음.\n구조  주어 The extra plants + 본동사 will help + 부정사 prevent the growth of weeds + 부사절 as the tomatoes mature.\n어휘  extra plants(추가로 심은 식물), prevent(막다), growth(성장), weed(잡초), mature(성숙하다)\n팁  어휘 문제는 앞 문장의 핵심어를 그대로 받는 어휘를 고르는 게 정석. '함께 심은 콩' = 'extra plants'.\n보기 뜻  (A) natural 자연의 · (B) colorful 다채로운 · (C) rare 드문 · (D) extra 추가의"]]}]},{"k":"RC11","part":5,"kind":"unit","name":"RC Unit 11 분사","h":0.5633,"pg":[206,213],"s":[{"n":1,"ov":[8.438,6.796,23.906,24.827],"p":206},{"n":2,"ov":[5.234,11.373,69.531,14.424],"p":206},{"n":3,"ov":[3.359,11.373,20.391,58.946],"p":206},{"n":4,"ov":[15.391,15.673,64.375,12.621],"p":206},{"n":5,"ov":[3.359,17.06,7.734,5.132],"p":206},{"n":6,"ov":[7.422,5.687,38.125,58.391],"p":207,"q":[[1,2,1,"정답 (B) decreasing\n해석  그 나라의 감소하는 수출은 경제 전문가들 사이에서 큰 우려를 불러일으켰다.\n해설  관사 The 다음 명사 exports 를 수식하는 형용사 자리. exports 는 능동적으로 감소하는 주체이므로 현재분사 (B) decreasing 이 정답. (A) decrease 는 명사/동사로 명사 앞 수식 부적합.\n구조  주어 The country's decreasing exports + 본동사 have caused + 목적어 great concern + 부사구 among economic experts.\n어휘  decreasing(감소하는), exports(수출), cause concern(우려를 야기하다), expert(전문가)\n팁  분사 + 명사 vs 명사 + 명사: 명사가 능동의 주체이면 -ing(감소하는 수출). decrease 는 명사로도 쓰이지만 형용사 역할은 못 함."],[2,2,0,"정답 (A) complicated\n해석  그 도시의 건축 법규는 따르기에 매우 복잡해졌다.\n해설  become 동사의 보어 자리에 형용사가 필요. complicated 는 형용사화된 과거분사로 '복잡한'의 의미. (A) complicated 가 정답. (B) complicate 는 동사원형.\n구조  주어 The city's building codes + 본동사 have become + 보어 very complicated + to 부정사 to accommodate.\n어휘  building code(건축 법규), complicated(복잡한), accommodate(따르다, 수용하다)\n팁  complicated/sophisticated/experienced/qualified 등은 형용사처럼 쓰이는 분사. 통째 암기."]]},{"n":7,"ov":[7.422,5.687,38.125,65.881],"p":207,"q":[[3,2,1,"정답 (B) involved\n해석  법적 사건에 연루된 사람은 누구든 변호사와 상담할 것을 권고받는다.\n해설  사람(person)은 사건에 연루되는 대상(수동)이며 빈칸 뒤에 목적어가 없고 전치사 in 이 이어지므로 과거분사 (B) involved 가 정답.\n구조  주어 Any person + 분사구 involved in a legal case(과거분사 수식) + 본동사 is advised + to 부정사 to consult a lawyer.\n어휘  be involved in(~에 연루되다, 관련되다), legal case(법적 사건), be advised to(~할 것을 권고받다), consult(상담하다)\n팁  be involved in = 수동태 + 전치사 패턴(Unit 9). 명사 + involved in = 분사 수식. '~에 연루된'."],[4,2,0,"정답 (A) purchased\n해석  이 광고가 게재되기 전에 구매된 티켓에는 할인 혜택이 적용되지 않는다.\n해설  tickets 는 구매되는 대상(수동)이고 빈칸 뒤에 전치사 before 가 있으므로 과거분사 (A) purchased 가 정답. (B) purchases 는 동사 단수/명사 복수.\n구조  주어 The discount offer + 본동사 is + 보어 not valid + 부사구 on tickets purchased before publication of this advertisement.\n어휘  discount offer(할인 혜택), valid(유효한), purchase(구매하다), publication(게재, 출간), advertisement(광고)\n팁  명사 + p.p. + 전치사구 = 명사 뒤 수식. 빈칸 뒤 전치사가 결정적 단서."]]},{"n":8,"ov":[7.422,5.687,17.812,41.886],"p":207,"q":[[5,4,1,"정답 (B) reduced\n해석  사소한 다리 보수 작업으로 인해 5 월 12 일부터 25 일까지 기차는 줄어든 빈도로 운행될 것이다.\n해설  전치사 with 뒤 명사 frequency 를 수식하는 형용사 자리. frequency 는 줄어드는 대상(수동)이므로 과거분사 (B) reduced 가 정답.\n구조  원인 부사구 Because of minor bridge repairs + 주어 trains + 본동사 will run + 부사구 with reduced frequency + 시간 부사구 from May 12 to May 25.\n어휘  minor(사소한), bridge repairs(다리 보수), frequency(빈도), reduced(줄어든)\n팁  with + 형용사/분사 + 명사 = 비즈니스 영어에서 자주. with reduced/limited/increased 등."]]},{"n":9,"ov":[7.422,5.687,17.812,49.515],"p":207,"q":[[6,4,3,"정답 (D) stored\n해석  귀하의 개인 디지털 파일은 저희 온라인 서버에 안전하게 저장된 채로 유지될 것입니다.\n해설  remain 은 보어를 취하는 동사. 파일은 저장되는 대상이므로 과거분사 (D) stored 가 정답.\n구조  주어 Your personal digital files + 본동사 will remain + 보어 stored(과거분사) + 부사 safely + 장소 부사구 on our online server.\n어휘  personal(개인의), remain stored(저장된 채로 유지되다), online server(온라인 서버)\n팁  remain/stay/keep + p.p. = '~된 채로 남다/유지하다'. 또한 keep + 목적어 + p.p. (5 형식)도 있음."]]},{"n":10,"ov":[7.422,5.687,17.812,42.164],"p":207,"q":[[7,4,1,"정답 (B) listing\n해석  무역 박람회의 모든 판매업체를 나열한 책자가 다음 주에 발송될 것이다.\n해설  주어가 'The brochure', 본동사가 'will be sent out'이므로 빈칸은 본동사가 아닌 분사 자리. 빈칸 뒤에 목적어 'all the vendors'가 있으므로 능동 의미의 현재분사 (B) listing 이 정답.\n구조  주어 The brochure + 분사구 listing all the vendors for the trade show(현재분사 + 목적어) + 본동사 will be sent out + 시간 부사 next week.\n어휘  brochure(책자, 안내서), vendor(판매업체), trade show(무역 박람회), send out(발송하다)\n팁  한 문장에 본동사 1 개. 본동사가 이미 있으면 빈칸은 분사. 빈칸 뒤 목적어 유무로 -ing/-ed 결정."]]},{"n":11,"ov":[7.422,5.687,17.812,57.143],"p":207,"q":[[8,4,3,"정답 (D) handwritten\n해석  Vargas 씨는 신입 직원 환영 카드에 손으로 쓴 메모를 반드시 포함시킨다.\n해설  명사 notes 를 앞에서 수식하는 형용사 자리. 메모는 손으로 쓰여지는 대상(수동)이므로 과거분사 (D) handwritten 이 정답.\n구조  주어 Mr. Vargas + 본동사 makes a point of + 동명사 including + 목적어 handwritten notes + 장소 부사구 in the welcome cards + 수식 for new employees.\n어휘  make a point of -ing(반드시 ~하다), handwritten(손으로 쓴), welcome card(환영 카드)\n팁  make a point of + 동명사 = '꼭 ~하다' 비즈니스 표현. handwritten/typed/printed 처럼 만들어지는 방식을 나타내는 p.p.."]]},{"n":12,"ov":[9.219,11.928,27.812,5.964],"p":208},{"n":13,"ov":[5.234,11.373,10.469,5.409],"p":208},{"n":14,"ov":[5.156,11.373,10.547,5.409],"p":208},{"n":15,"ov":[3.281,11.373,36.562,49.792],"p":208},{"n":16,"ov":[5.234,11.373,16.719,5.409],"p":208},{"n":17,"ov":[7.422,5.687,38.125,66.019],"p":209,"q":[[1,2,0,"정답 (A) damaged\n해석  분실되거나 손상된 수하물을 신고하려면 Nextrair 수하물 서비스 부스를 방문하십시오.\n해설  baggage(수하물)는 손상되는 대상(수동)이므로 과거분사 (A) damaged 가 정답. lost 와 병렬되어 모두 과거분사 형태.\n구조  부사적 to 부정사 To report lost or damaged baggage(목적) + 주절 please visit Nextrair's baggage services booth(명령문).\n어휘  report(신고하다), lost(분실된), damaged(손상된), baggage(수하물)\n팁  lost or damaged 세트 표현. 사물(baggage, item, document)은 행위를 당하는 입장이므로 거의 항상 p.p.."],[2,2,1,"정답 (B) requiring\n해석  정부는 소유주가 세입자들에게 재활용 서비스를 제공하도록 요구하는 규정을 발표했다.\n해설  regulations 다음에 빈칸 뒤 목적어 'owners to provide...'가 있으므로 능동 의미의 현재분사 (B) requiring 이 정답. require 는 'require A to do' 5 형식 동사.\n구조  주어 The government + 본동사 has published + 목적어 regulations + 분사구 requiring owners to provide recycling services for tenants(현재분사+목적어+to 부정사).\n어휘  regulation(규정), require A to do(A 에게 ~할 것을 요구하다), recycling service(재활용 서비스), tenant(세입자)\n팁  명사 + -ing + 목적어 = 능동 분사 수식. require/allow/ask + O + to do 5 형식 패턴 함께 익히기."]]},{"n":18,"ov":[7.422,5.687,38.203,70.042],"p":209,"q":[[3,2,1,"정답 (B) exciting\n해석  3 월에 그 도시의 오케스트라는 재능 있는 신예 Maria Cruz 의 흥미진진한 오페라를 공연할 것이다.\n해설  opera 는 감정을 유발하는 사물이므로 현재분사 (B) exciting 이 정답. (A) excited 는 감정을 느끼는 사람과 어울림.\n구조  시간 부사구 In March + 주어 the city's orchestra + 본동사 will present + 목적어 an exciting opera + 행위자 by talented newcomer Maria Cruz.\n어휘  orchestra(오케스트라), present(공연하다, 발표하다), exciting(흥미진진한), talented(재능 있는), newcomer(신예)\n팁  감정 분사 핵심 구분: 감정을 만들어내는 사물/사건/공연 → -ing / 감정을 느끼는 사람 → -ed."],[4,2,1,"정답 (B) disappointed\n해석  그 영업 사원은 고객들의 부정적인 피드백에 실망했다.\n해설  주어가 사람(sales representative)이고 감정을 느끼는 입장이므로 과거분사 (B) disappointed 가 정답. 'be disappointed in/with(~에 실망하다)' 패턴.\n구조  주어 The sales representative + 본동사 is disappointed + 전치사구 in negative feedback + 수식 from his customers.\n어휘  sales representative(영업 사원), be disappointed in(~에 실망하다), negative feedback(부정적인 피드백)\n팁  be disappointed in/with + 명사. 감정 분사 + 전치사 패턴은 함께 묶어서 외우기."]]},{"n":19,"ov":[7.422,5.687,17.812,42.164],"p":209,"q":[[5,4,1,"정답 (B) supervising\n해석  국제 거래처를 감독한 경험 덕분에 Ito 씨는 해외 사무소를 맡게 될 것이다.\n해설  experience 뒤에서 수식하며 빈칸 뒤에 목적어 'international accounts'가 있으므로 현재분사 (B) supervising 이 정답.\n구조  원인 부사구 Because of his experience supervising international accounts(experience+분사구) + 주어 Mr. Ito + 본동사 will take charge of + 목적어 the overseas office.\n어휘  experience -ing(~한 경험), supervise(감독하다), international account(국제 거래처), take charge of(~을 맡다), overseas office(해외 사무소)\n팁  experience + 동명사/분사 = 행위 경험. 빈칸 뒤 목적어 → 현재분사."]]},{"n":20,"ov":[7.422,5.687,17.812,57.143],"p":209,"q":[[6,4,3,"정답 (D) advanced\n해석  Liffler 사의 수석 분석가 직책에는 경제학 고급 학위가 필요하다.\n해설  관사 An 다음 명사 degree 를 수식하는 형용사 자리. 'advanced degree(고급 학위)'는 비 \n구조  주어 Many people + 관계절 who were interviewed(주격+동사) + 본동사 felt + that 절 [that they did not need a larger car].\n어휘  interview(면접하다), feel that(~라고 느끼다)\n팁  주격 관계대명사 = 빈칸 뒤 바로 동사. 사람 선행사 + 주격 = who. 'who(주격) vs whom(목적격)' 구분 핵심."],[2,2,0,"정답 (A) which\n해석  약 2,000 명의 사람들이 지난달에 열린 채용 박람회에 갔다.\n해설  선행사 the job fair(사물)이고 빈칸 뒤 동사 was held 가 이어지므로 주격 관계대명사 (A) which 가 정답. (B) whose 는 소유격.\n구조  주어 Around 2,000 people + 본동사 went + 부사구 to the job fair + 관계절 which was held last month(주격+동사).\n어휘  job fair(채용 박람회), be held(열리다, 개최되다)\n팁  사물 선행사 + 주격 관계대명사 = which 또는 that. 둘 다 사용 가능."]]},{"n":6,"ov":[7.422,5.825,45.547,65.742],"p":229,"q":[[3,2,0,"정답 (A) that\n해석  이 부츠는 내구성이 강하고 청소하기 쉬운 합성 가죽으로 만들어진다.\n해설  선행사 synthetic leather(사물)이고 빈칸 뒤 동사 is 가 이어지므로 주격 관계대명사 (A) that 이 정답. (B) whom 은 사람 선행사 + 목적격.\n구조  주어 These boots + 본동사 are made of + 목적어 synthetic leather + 관계절 that is durable and easy to clean.\n어휘  synthetic leather(합성 가죽), durable(내구성 있는), easy to clean(청소하기 쉬운)\n팁  that 은 사람·사물 선행사 모두 가능한 만능. 사물 + 주격 = that 또는 which."],[4,2,1,"정답 (B) who\n해석  여권을 검사하는 세관 직원은 방문객 비자를 발급할 권한도 있다.\n해설  선행사 customs agent(사람)이고 빈칸 뒤 동사 inspects 가 이어지므로 주격 관계대명사 (B) who 가 정답. (A) whose 는 소유격으로 뒤에 명사가 와야 함.\n구조  주어 The customs agent + 관계절 who inspects passports + 본동사 is also authorized + 부정사 to issue visitors' visas.\n어휘  customs agent(세관 직원), inspect(검사하다), passport(여권), be authorized to(~할 권한이 있다), visa(비자)\n팁  사람 + 주격 + 동사 = who + V. whose 는 소유격이라 'whose + 명사' 형태."]]},{"n":7,"ov":[7.422,5.825,17.031,34.397],"p":229,"q":[[5,4,0,"정답 (A) who\n해석  Reston 씨와 Parnthong 씨는 지난주 고객들을 방문한 두 명의 시니어 파트너였다.\n해설  선행사 senior partners(사람) + 빈칸 뒤 동사 visited → 주격 관계대명사 (A) who 가 정답. (B) when 은 시간 관계부사, (C) what 은 선행사 포함, (D) whose 는 소유격.\n구조  주어 Ms. Reston and Mr. Parnthong + 본동사 were + 보어 two of the senior partners + 관계절 who visited the clients last week.\n어휘  senior partner(시니어 파트너, 선임 동업자), visit(방문하다), client(고객)\n팁  사람 + 주격 + 동사 = who. what 은 'the thing(s) which'로 선행사를 포함하므로 선행사가 있으면 못 씀."]]},{"n" const $ = s => document.querySelector(s);

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('wb650:' + k) || '{}'); } catch (e) { return {}; } },

};

function qCount(d) { return d.s.reduce((n, s) => n + (s.q ? s.q.length : 0), 0); }
/* 한 쪽(슬라이드)의 문항을 모두 골라야 채점·정답 공개 (2026-10-03 사용자: 1번만 고르면 2번 답까지 드러난다) */
function full(a, s, i) { return !!(s.q && s.q.length) && s.q.every((q, j) => a[i + '_' + j] !== undefined); }
const WAIT = '<span class="res" style="color:var(--mute)">고름 · 이 쪽 문항을 모두 고르면 채점</span>';
function done(d) { const a = store.get(d.k); let ok = 0, n = 0; d.s.forEach((s, i) => { if (!full(a, s, i)) return; s.q.forEach((q, j) => { n++; if (a[i + '_' + j] === q[2]) ok++; }); }); return {ok, n}; }

function deck(i) {

      const btns = Array.from({length: q[1]}, (_, k) => `<button class="ch${v !== undefined ? (k === q[2] ? ' ok' : k === v ? ' ng' : '') : (k === pv ? ' sel' : '')}" data-k="${k}">(${L[k]})</button>`).join('');

      h += `<div class="qrow${v !== undefined ? ' done' : ''}" data-s="${si}" data-q="${qi}"><span class="lab">${esc(lab)}</span>${btns}${res}<div class="ex">${esc(q[3] || '정답 (' + L[q[2]] + ')')}</div></div>`;
    });
    const tog = (s.ov || (s.q && s.q.length)) ? `<button class="btn tog">정답 보기</button>` : '';
    h += `<div class="meta"><span>${s.n} / ${d.s.length}쪽${s.p ? ' · 교재 p.' + s.p : ''}</span><span class="sp"></span>${tog}</div></div>`;
  });
  const prev = D.decks[i - 1], next = D.decks[i + 1];
  h += `<div class="nav">${prev ? `<button class="btn" id="prev">‹ ${esc(prev.name)}</button>` : '<span></span>'}${next ? `<button class="btn pri" id="next">${esc(next.name)} ›</button>` : ''}</div>`;
  $('#app').innerHTML = h;
  const score = () => { const r = done(d), n = qCount(d); $('#score').textContent = n ? `맞힘 ${r.ok} / ${n}` : ''; };
  score();
  $('#back').onclick = () => { location.hash = '#/'; };
  $('#reset').onclick = () => { if (confirm(d.name + ' 푼 기록을 지우고 처음부터 풀까요?')) { store.del(d.k); deck(i); } };
  if (prev) $('#prev').onclick = () => { location.hash = '#/' + prev.k; };
  if (next) $('#next').onclick = () => { location.hash = '#/' + next.k; };
  let all = false;
  $('#all').onclick = () => { all = !all; document.querySelectorAll('.card').forEach(c => c.classList.toggle('show', all)); $('#all').textContent = all ? '정답 모두 가리기' : '정답 모두 보기'; document.querySelectorAll('.tog').forEach(b => b.textContent = all ? '정답 가리기' : '정답 보기'); };
  document.querySelectorAll('.tog').forEach(b => b.onclick = () => { const c = b.closest('.card'); c.classList.toggle('show'); b.textContent = c.classList.contains('show') ? '정답 가리기' : '정답 보기'; });
  document.querySelectorAll('.qrow').forEach(r => r.querySelectorAll('.ch').forEach(b => b.onclick = () => {
    const si = +r.dataset.s, qi = +r.dataset.q, q = d.s[si].q[qi], k = +b.dataset.k;

      r.querySelector('.ex').insertAdjacentHTML('beforebegin', WAIT);
      return;
    }
    c.querySelectorAll('.qrow').forEach(rr => {              // 다 골랐으면 이 쪽 문항 전부 채점·공개
      const j = +rr.dataset.q, qq = s.q[j], v = a[si + '_' + j];

      rr.querySelectorAll('.res').forEach(x => x.remove());

      rr.classList.add('done');

    score();
  }));
  window.scrollTo(0, 0);
}

function route() {
  const k = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const i = D.decks.findIndex(d => d.k === k);
  if (i >= 0) deck(i); else home();
}
window.addEventListener('hashchange', route);
route();
</script>

<script>/* 통합앱에서 열었을 때만 맨 위에 「‹ 전체 앱」(hubback.py) */
(function () {
  var u; try { u = sessionStorage.getItem('hub:back'); } catch (e) {}
  if (!u || u.indexOf(location.origin + '/') !== 0) return;
  var box = document.createElement('div'), a = document.createElement('a');
  box.setAttribute('style', 'max-width:780px;margin:0 auto;padding:10px 16px 0');
  a.id = 'hubBack'; a.href = u; a.textContent = '‹ 전체 앱';
  a.setAttribute('style', 'display:inline-block;padding:6px 14px 6px 10px;border:1px solid var(--line,#e1e0da);border-radius:999px;background:var(--card,#fff);color:var(--acc,#2f5bd3);font:600 14px/1.4 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;text-decoration:none');
  a.onclick = function (e) {
    var t = document.getElementById('test'), h = document.getElementById('home');   // 시험 화면이 있는 앱은 그것으로, 없으면 첫 화면이 보이는지로
    var idle = t ? (t.hidden || t.offsetParent === null) : (!!h && !h.hidden && h.offsetParent !== null);
    if (!idle && !confirm('전체 앱 목록으로 돌아갈까요?\n지금 푸는 문제는 이어서 풀 수 없을 수도 있습니다.')) e.preventDefault();
  };
  box.appendChild(a);
  document.body.insertBefore(box, document.body.firstChild);
  // 선생님 앱(leess-teacher)에서 왔으면 선생님 화면을 바로 연다(코드는 선생님 앱이 이 앱의 코드 자리에 넣어 두었다). 한 번만.
  var tf; try { tf = sessionStorage.getItem('hub:teacher'); sessionStorage.removeItem('hub:teacher'); } catch (e) {}
  var tb = document.getElementById('teacherBtn');
  if (tf === '1' && tb && !tb.hidden) tb.click();
})();
</script>
